# Publishes to npm through trusted publishing (OIDC), so no npm token is
# stored anywhere. One-time setup on npmjs.com: package settings ->
# Trusted publisher -> GitHub Actions, with this repository and the
# workflow filename "release.yml". A version already on npm is skipped, so
# the workflow is safe to re-run. Trusted publishing needs npm >= 11.5.1,
# which is why the job runs on Node 24 (Node 22 bundles npm 10).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $NAME@$VERSION"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
